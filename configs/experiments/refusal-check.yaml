# Sanity check (2026-11-16): does each abliterated variant refuse harmful requests less than its
# stock twin? No conditioning, benchmarks only. Heuristic refusal scorer; judge off.
# Run: HF_HUB_OFFLINE=1 uv run ethica run configs/experiments/refusal-check.yaml
name: refusal-check
models: [qwen3-1.7b, qwen3-1.7b-abl, qwen3-4b, qwen3-4b-abl, qwen3-8b, qwen3-8b-abl,
         llama-3.2-3b, llama-3.2-3b-abl, gemma-3-4b, gemma-3-4b-abl, smollm3-3b, smollm3-3b-abl,
         phi-4-mini, phi-4-mini-abl, granite-4.1-3b, granite-4.1-3b-abl]
frameworks: [none]
methods: [prompt]
scenarios: []
benchmarks:
  harmbench: 40
  xstest_unsafe: 40
  xstest_safe: 40
seeds: [0]
generation:
  max_tokens: 384
  temperature: 0.7
judge:
  enabled: false
report:
  min_tasks: 1
