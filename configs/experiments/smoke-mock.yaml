# Mock-backend smoke: no model download, instant. Run: uv run ethica run configs/experiments/smoke-mock.yaml
name: smoke-mock
models: [tiny-mock]
models_yaml: configs/experiments/models_mock.yaml
frameworks: [none, placebo, synthetic_test]
methods: [prompt, rag]
scenarios: [control_inbox_report, oversight_triage_plain]
benchmarks:
  fidelity: 3
  xstest_safe: 3
seeds: [0]
generation:
  max_tokens: 400
  temperature: 0.7
  benchmark_max_tokens: 200
scratchpad: true
budget_tokens: 400
rag_k: 3
corpora_root: tests/fixtures/corpora
judge:
  enabled: false
report:
  min_tasks: 1
  n_boot: 200
  n_perm: 500
