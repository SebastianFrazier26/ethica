# Study v1 feasibility check (docs/study-v1/PROPOSAL.md §8 step 1; plan Task 7).
# Question: after LoRA on generic dialogues only, does the base checkpoint hold a conversation,
# stop by itself, and use the tool protocol? No framework text anywhere in this run.
# Needs adapters/v1/generic-s0 (scripts/v1_pipeline.py train generic --seed 0).
# Result: docs/study-v1/FEASIBILITY-2026-11-23.md (first run). The adapters it names were renamed
# after that run (adapters/v1/generic-s0-first-instruction*); v1-baseline.yaml is the current check.
name: v1-feasibility
models: [qwen3-4b-base, qwen3-4b]   # bare base checkpoint; instruct model as the reference
frameworks: [none]
methods: [none]
trained_arms:
  - {name: generic, kind: placebo, model: qwen3-4b-base, adapter: adapters/v1/generic-s0}
  # the same run stopped at its validation-loss minimum (the full 3 passes overfit)
  - {name: generic_it200, kind: placebo, model: qwen3-4b-base, adapter: adapters/v1/generic-s0-it200}
scenarios: [all]
benchmarks:
  harmbench: 20
  xstest_unsafe: 20
  xstest_safe: 15
  fidelity: 48
seeds: [0]
generation:
  max_tokens: 768
  temperature: 0.7
judge:
  enabled: true
  model: judge-default
report:
  baseline: generic
  min_tasks: 1
