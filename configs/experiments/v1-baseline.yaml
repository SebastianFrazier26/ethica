# Study v1 baseline table (docs/study-v1/FEASIBILITY-2026-11-23.md, second run).
# Instruct reference, bare base checkpoint and the generic (no-ethics) trained arm on the harm
# benchmarks, the fidelity probe, the built-in scenarios and a capability check (gsm8k, mmlu).
# No framework text anywhere. Needs adapters/v1/generic-s0:
#   uv run python scripts/v1_pipeline.py generate generic && ... dataset generic && ... train generic
name: v1-baseline
models: [qwen3-4b-base, qwen3-4b]
frameworks: [none]
methods: [none]
trained_arms:
  - {name: generic, kind: placebo, model: qwen3-4b-base, adapter: adapters/v1/generic-s0}
scenarios: [all]
benchmarks:
  harmbench: 20
  xstest_unsafe: 20
  xstest_safe: 15
  fidelity: 48
  gsm8k: 30
  mmlu: 40
seeds: [0]
generation:
  max_tokens: 768
  temperature: 0.7
judge:
  enabled: true
  model: judge-default
report:
  baseline: generic
  min_tasks: 1
