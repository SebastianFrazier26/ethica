# Same experiment name/DB as smoke.yaml: generation resumes (all skipped), then the judge
# pass runs with the tiny model standing in as judge, only to exercise the code path.
# Run after smoke.yaml: uv run ethica run configs/experiments/smoke-judge.yaml --phase judge
name: smoke
models: [tiny]
frameworks: [none, placebo, synthetic_test]
methods: [prompt, rag]
scenarios: [control_inbox_report, oversight_triage_plain]
benchmarks:
  fidelity: 3
  xstest_safe: 3
seeds: [0]
generation:
  max_tokens: 400
  temperature: 0.7
  benchmark_max_tokens: 200
scratchpad: true
budget_tokens: 400
rag_k: 3
corpora_root: tests/fixtures/corpora
judge:
  enabled: true
  model: tiny
  allow_self_judge: true
report:
  min_tasks: 1
  n_boot: 200
  n_perm: 500
