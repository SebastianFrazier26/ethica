# Exploratory (2026-11-18): does RAG framework conditioning move harmful compliance in the
# abliterated model, all 7 frameworks vs placebo, 3 seeds? Follows the single-seed shakedown hint
# (deontology 0.28-0.38 vs placebo 0.40, act-util 0.54). Benchmarks only: builtin scenarios floor
