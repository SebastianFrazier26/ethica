scenarios: []
benchmarks:
  fidelity: 48
  harmbench: 40
  xstest_unsafe: 40
  xstest_safe: 25
seeds: [0, 1, 2]
generation:
  max_tokens: 768
  temperature: 0.7
budget_tokens: 1000
judge:
  enabled: true
  model: judge-default
report:
  min_tasks: 1
