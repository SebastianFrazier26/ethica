# Virtue arm after critique and revise (D-70, owner 2026-11-25: D-75), training seed 1, with the
# generic arm of the same seed as the gate's reference. Same prompts as the pilot configs, no
# scenarios and no pressure variants. Compare with v1-pilot-s1 (virtue before revision).
name: v1-virtue-revised-s1
models: [qwen3-4b-base-abl]
frameworks: [none]
methods: [none]
trained_arms:
  - {name: generic, kind: placebo, model: qwen3-4b-base-abl, adapter: adapters/v1/abl/generic-s1}
  - {name: virtue, kind: ethics, model: qwen3-4b-base-abl, adapter: adapters/v1/abl/virtue.revised-s1}
scenarios: []
benchmarks:
  harmbench: 40
  xstest_unsafe: 40
  xstest_safe: 20
  fidelity: 48
  open_dilemmas: 48
  gsm8k: 30
  mmlu: 40
seeds: [0]
generation:
  max_tokens: 768
  temperature: 0.7
judge:
  enabled: true
  model: judge-default
report:
  baseline: generic
  min_tasks: 1
