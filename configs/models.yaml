# Candidate model registry. Every hf_repo verified to exist via HfApi().model_info on 2026-11-16.
# size_gb = sum of *.safetensors on the Hub. gated=false for all listed repos (mlx-community
# mirrors are ungated; the upstream originals of Llama/Gemma require licence acceptance).
# `revision` pins the Hub commit (sha at 2026-11-16, equal to the local cache snapshot) for every
# entry loaded from hf_repo; local_path entries are pinned by provenance.json instead.
# Quantisation is harmonised to affine 4-bit / group 64 (`quant: q4g64`, D-33). Entries with
# `local_path` are re-converted from the full-precision source by scripts/harmonize_quant.py
# (models/ is gitignored; rerun the script on a fresh clone). hf_repo is then provenance only and
# size_gb is the converted size; see models/<key>-q4g64/provenance.json for source repo + sha.
models:
  # ---- tiny: smoke tests only ----
  - key: tiny
    hf_repo: mlx-community/Qwen2.5-0.5B-Instruct-4bit
    revision: a5339a4131f135d0fdc6a5c8b5bbed2753bbe0f3
    family: qwen2.5
    params_b: 0.5
    safeguards: stock
    size_gb: 0.28
    quant: q4
    notes: smoke-test model; not part of any experiment grid

  # ---- judge ----
  - key: judge-default
    hf_repo: mlx-community/Qwen3-8B-4bit
    revision: 545dc4251c05440727734bcd94334791f6ab0192
    family: qwen3
    params_b: 8.2
    safeguards: stock
    lora_ok: false
    max_context: 16384
    size_gb: 4.61
    quant: q4
    notes: same weights as qwen3-8b; separate key so the judge can be swapped independently

  # ---- Qwen3 (Qwen3-4B uses the Instruct-2507 line so the abliterated variant has a stock twin) ----
  - key: qwen3-1.7b
    hf_repo: mlx-community/Qwen3-1.7B-4bit
    family: qwen3
    params_b: 1.7
    safeguards: stock
    size_gb: 0.97
    quant: q4g64
    local_path: models/qwen3-1.7b-q4g64
  - key: qwen3-1.7b-abl
    hf_repo: huihui-ai/Huihui-Qwen3-1.7B-abliterated-v2
    family: qwen3
    params_b: 1.7
    safeguards: abliterated
    base_of: qwen3-1.7b
    size_gb: 0.97
    quant: q4g64
    local_path: models/qwen3-1.7b-abl-q4g64
    notes: no pure-abliteration MLX 4-bit exists (mlx-community only has the Josiefied fine-tune, rejected as a confound); converted locally from the huihui bf16 repo

  - key: qwen3-4b
    hf_repo: mlx-community/Qwen3-4B-Instruct-2507-4bit
    revision: 50d427756c6b1b2fe0c0a10f67fbda1fc8e82c1b
    family: qwen3
    params_b: 4.0
    safeguards: stock
    max_context: 32768
    size_gb: 2.26
    quant: q4
  - key: qwen3-4b-base
    hf_repo: Qwen/Qwen3-4B-Base
    family: qwen3
    params_b: 4.0
    safeguards: base
    max_context: 32768
    size_gb: 2.26
    quant: q4g64
    local_path: models/qwen3-4b-base-q4g64
    notes: "study v1 starting point (D-61): pretrained checkpoint, no instruct or safety post-training; Apache-2.0; converted by scripts/prepare_base_model.py, which also sets the chat template and end-of-turn token (see provenance.json)"
  - key: qwen3-4b-abl
    hf_repo: mlx-community/Qwen3-4B-Instruct-2507-gabliterated-4bit
    revision: eec01591c9aa260a6387869b012dbf2d150033b4
    family: qwen3
    params_b: 4.0
    safeguards: abliterated
    base_of: qwen3-4b
    max_context: 32768
    size_gb: 2.26
    quant: q4
    notes: "Goekdeniz-Guelmez 'gabliterated' (a refusal-direction-removal variant), not huihui/mlabonne-style abliteration"

  - key: qwen3-8b
    hf_repo: mlx-community/Qwen3-8B-4bit
    revision: 545dc4251c05440727734bcd94334791f6ab0192
    family: qwen3
    params_b: 8.2
    safeguards: stock
    lora_ok: false
    max_context: 16384
    size_gb: 4.61
    quant: q4
  - key: qwen3-8b-abl
    hf_repo: mlx-community/Qwen3-8B-abliterated-v2-mxfp4
    revision: 0310576b3aa0daf9d8ad6ec370ff2c545ef02194
    family: qwen3
    params_b: 8.2
    safeguards: abliterated
    base_of: qwen3-8b
    lora_ok: false
