# Study v1 pilot: data generation and training settings (docs/study-v1/PROPOSAL.md, D-61..D-65).
# Read by scripts/v1_pipeline.py. Starting values; the feasibility check may revise them.
base_model: qwen3-4b-base
teacher: qwen3-4b-abl
n_prompts: 500
prompt_seed: 0
data_root: data/v1          # gitignored
adapters_root: adapters/v1  # gitignored; never published (proposal §6)
generation:
  max_tokens: 400
  temperature: 0.7
rag_k: 4
budget_tokens: 1000
arms:
  # `commitments` files hold the owner-approved framework statements (D-64). The ethics arms
  # must not be generated until those are signed off; the script refuses without the file.
  - {name: generic, kind: generic}
  - {name: placebo, kind: placebo, corpus: placebo}
  - {name: virtue, kind: ethics, corpus: virtue, commitments: configs/training/commitments/virtue.md}
  - {name: deontology, kind: ethics, corpus: deontology, commitments: configs/training/commitments/deontology.md}
  - {name: act_utilitarian, kind: ethics, corpus: act_utilitarian, commitments: configs/training/commitments/act_utilitarian.md}
train_seeds: [0, 1, 2]      # default, pending owner (D-65)
epochs: 3
lora:
  rank: 16
  scale: 20.0
  num_layers: 16
  batch_size: 2
  max_seq_length: 1024
  learning_rate: 1.0e-4
  steps_per_eval: 100
  save_every: 100
mlx_extra:
  mask_prompt: true         # loss on the assistant turn only; the prompts are shared by all arms
