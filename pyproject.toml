[project]
name = "ethica"
version = "0.0.1"
description = "Harness for measuring how ethical-framework conditioning affects misalignment in small open-weight LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-lm>=0.20",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "huggingface-hub>=0.24",
    "datasets>=2.20",
    "matplotlib>=3.11.2",
]

[project.scripts]
ethica = "ethica.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "pip-audit>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ethica"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/ethica"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads a real model or downloads data (deselect with -m 'not slow')",
]
addopts = "-m 'not slow'"
