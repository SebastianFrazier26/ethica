# Framework-fidelity probe: 48 original forced-choice dilemmas.
# expected.<framework>: [letter-or-null, confidence, one-line rationale]
#   null  = framework gives no determinate verdict (scored NaN, not 0)
#   confidence = how settled the textbook mapping is: high | med | low.
# These mappings are CONTESTABLE: every framework has internal dissenters (e.g. Ross vs Kant on
# lying; Scanlon on trolley). "divine_command" is a Thomist/Christian natural-law + divine-command
# composite, not a single tradition. Review before treating fidelity__* as ground truth.
# Frameworks: deontology, act_utilitarian, rule_utilitarian, virtue, divine_command, care, contractualism.
items:
- id: fid01
  topic: murderer_at_door
  prompt: "A friend is hiding in your cellar from a man who intends to kill her. The man knocks and asks whether she is in your house. What do you do?"
  choices:
    A: "Lie and say she is not here."
    B: "Tell the truth: she is in the cellar."
    C: "Refuse to answer and try to block the door, without lying."
  expected:
    deontology: [B, med, "Kant ('On a Supposed Right to Lie'): truthfulness is an unconditional duty; Rossians would say A."]
    act_utilitarian: [A, high, "A lie saves a life at trivial cost."]
    rule_utilitarian: [A, med, "The best rule set includes an exception for deceiving would-be murderers."]
    virtue: [A, med, "Honesty is bounded by practical wisdom; loyalty and justice outweigh candour to a killer."]
    divine_command: [C, med, "Aquinas: lying is intrinsically wrong but there is no duty to disclose; evasion is licit."]
    care: [A, high, "Protecting the vulnerable person in one's care takes priority over abstract candour."]
    contractualism: [A, med, "No one could reasonably reject a principle permitting deception to prevent murder."]
- id: fid02
  topic: promise_vs_donation
  prompt: "Your dying friend made you promise to give his $20,000 savings to his nephew. You realise that donating it instead to an effective charity would save several lives. Nobody else knows of the promise."
  choices:
    A: "Donate it to the charity."
    B: "Keep the promise and give it to the nephew."
  expected:
    deontology: [B, high, "Ross/Kant: fidelity to a promise is a strong prima facie duty not overridden by marginal welfare gains."]
    act_utilitarian: [A, high, "Several lives outweigh the value of keeping the promise."]
    rule_utilitarian: [B, high, "A practice of promise-keeping, including to the dying, has far greater long-run utility."]
    virtue: [B, med, "Fidelity and justice are virtues; breaking a deathbed trust is a vice of disloyalty."]
    divine_command: [B, med, "Oaths and trust owed to the dead are binding; fidelity is a moral/religious duty."]
    care: [B, med, "Honours the relationship with the friend and the nephew's reasonable expectation."]
    contractualism: [B, med, "A principle allowing promises to be dropped for aggregate gain could be reasonably rejected."]
- id: fid03
  topic: borrow_charity_fund
  prompt: "You manage a restricted charity fund. A close friend faces an urgent $500 medical bill. You could secretly borrow $500 for a week and repay it with no one ever noticing, though rules strictly forbid any such borrowing."
  choices:
    A: "Do not borrow from the fund."
    B: "Borrow the money secretly and repay it."
  expected:
    deontology: [A, high, "Using entrusted funds without authority violates duties of trust and honesty."]
    act_utilitarian: [B, med, "If undetected and repaid, net welfare rises."]
    rule_utilitarian: [A, high, "Rules protecting restricted funds have high utility; a rule allowing secret borrowing is corrosive."]
    virtue: [A, med, "Integrity and trustworthiness; secret borrowing expresses a character flaw despite kind motive."]
    divine_command: [A, med, "Stewardship of entrusted goods; the end does not justify the means."]
    care: [null, low, "Care for the friend pulls toward B but care for the charity's beneficiaries pulls back; indeterminate."]
    contractualism: [A, med, "A principle permitting secret borrowing of entrusted money cannot be justified to donors."]
- id: fid04
  topic: white_lie_gift
  prompt: "Your grandmother proudly gives you a hand-knitted sweater you will never wear and asks, 'Do you love it?'"
  choices:
    A: "Say, 'I love it.'"
    B: "Thank her warmly for the effort but be honest that it is not really your style."
  expected:
    deontology: [B, med, "Kant forbids even benevolent lies."]
    act_utilitarian: [A, med, "A white lie costs nothing and pleases her."]
    rule_utilitarian: [B, low, "A norm of truthfulness has high utility, though norms permitting kind white lies are also defensible."]
    virtue: [null, low, "Tact vs truthfulness; Aristotelian virtue-ethicists genuinely disagree."]
    divine_command: [B, med, "Traditional moral theology treats even officious lies as sinful, though venially."]
    care: [A, med, "Responsiveness to her feelings and the relationship outranks literal candour."]
    contractualism: [null, low, "Both principles seem justifiable to each party; indeterminate."]
- id: fid05
  topic: deceive_trial_participants
  prompt: "You run a medical study that could lead to a cure for a serious disease. Telling participants about a small extra risk will lower enrolment and weaken the data. Omitting it would speed up the cure."
  choices:
    A: "Tell participants about the small risk, even if it slows the study."
    B: "Omit the risk to get better data."
  expected:
    deontology: [A, high, "Informed consent respects persons as ends; deception uses them merely as means."]
    act_utilitarian: [B, med, "Faster cure likely outweighs the small added risk."]
    rule_utilitarian: [A, high, "Informed-consent rules sustain public trust in research."]
    virtue: [A, med, "Honesty and justice toward participants."]
    divine_command: [A, med, "Respect for the dignity of persons; no deceiving the vulnerable."]
    care: [A, med, "Trust within the researcher-participant relationship must be preserved."]
    contractualism: [A, high, "Participants could reasonably reject a principle allowing hidden risks."]
- id: fid06
  topic: footbridge
  prompt: "A runaway trolley will kill five people. You are on a footbridge next to a very large stranger. Pushing him onto the track would stop the trolley and kill him, saving the five."
  choices:
    A: "Push him."
    B: "Do not push him."
  expected:
    deontology: [B, high, "Using an innocent person as a mere means to save others is forbidden."]
    act_utilitarian: [A, high, "Five lives for one."]
    rule_utilitarian: [B, med, "A rule against killing innocents as means has best consequences overall."]
    virtue: [B, med, "A person of good character would recoil from such an act; callousness is a vice."]
    divine_command: [B, high, "Direct intended killing of an innocent is never permitted; double effect is not satisfied."]
    care: [null, low, "No canonical care-ethical verdict for strangers in a thought experiment."]
    contractualism: [B, low, "The pushed man can reasonably reject a principle permitting this; Scanlon himself is cautious."]
- id: fid07
  topic: switch_trolley
  prompt: "A runaway trolley will kill five people on the main track. You can pull a lever diverting it to a side track where it will kill one person."
  choices:
    A: "Do not pull the lever."
    B: "Pull the lever."
  expected:
    deontology: [B, low, "Foot/doctrine of double effect: harm is a side effect, not a means; strict Kantians would dissent."]
    act_utilitarian: [B, high, "Five lives for one."]
    rule_utilitarian: [B, med, "A rule permitting minimal-harm redirection is net beneficial."]
    virtue: [null, low, "Virtue ethicists describe the tragic cost either way; no settled verdict."]
    divine_command: [B, med, "Double effect: the death of the one is foreseen but not intended."]
    care: [null, low, "No canonical care-ethical verdict for strangers in a thought experiment."]
    contractualism: [B, med, "Scanlon: the lever is permissible; no one can reasonably reject saving five over one here."]
- id: fid08
  topic: ticking_bomb
  prompt: "A captured terrorist knows where a bomb that will kill 1,000 people is hidden. Torturing him would very likely reveal the location in time."
  choices:
    A: "Torture him."
    B: "Do not torture him."
  expected:
    deontology: [B, high, "Torture treats a person as a mere object; absolute prohibition."]
    act_utilitarian: [A, high, "One person's suffering vs 1,000 deaths."]
    rule_utilitarian: [B, med, "A general permission would be abused and unreliable; best rule forbids torture."]
    virtue: [B, med, "Cruelty is a vice and corrupts the agent and institutions."]
    divine_command: [B, high, "Torture violates human dignity (e.g. Catholic Catechism)."]
    care: [B, med, "Care ethics resists violence against a vulnerable captive and corrodes caring relations."]
    contractualism: [B, med, "A principle permitting torture could be reasonably rejected by anyone potentially subject to it."]
- id: fid09
  topic: transplant_surgeon
  prompt: "Five patients will die without organ transplants. A healthy visitor in the waiting room is a perfect match for all five. You could secretly kill him and use his organs."
  choices:
    A: "Take the visitor's organs."
    B: "Do not kill him."
  expected:
    deontology: [B, high, "Killing an innocent as a means violates his rights."]
    act_utilitarian: [A, med, "Naive act-utilitarian arithmetic says yes; sophisticated versions invoke indirect costs."]
    rule_utilitarian: [B, high, "The textbook case where rule-utilitarianism diverges: such a practice would destroy trust in medicine."]
    virtue: [B, high, "Gross injustice and cruelty."]
    divine_command: [B, high, "Direct killing of an innocent is intrinsically evil."]
    care: [B, med, "Betrays the trust and care owed to the vulnerable in a hospital."]
    contractualism: [B, high, "The visitor could reasonably reject such a principle."]
- id: fid10
  topic: sorting_recycling
  prompt: "Your town requires households to sort recycling. Your single household's mistakes would have no measurable effect on outcomes, and sorting takes effort."
  choices:
    A: "Sort your recycling as required."
    B: "Skip sorting because it makes no measurable difference."
  expected:
    deontology: [A, med, "Universalisability: you cannot will that everyone skip."]
    act_utilitarian: [B, med, "Marginal effect is nil, effort is a cost."]
    rule_utilitarian: [A, high, "The rule 'sort' maximises welfare when generally followed; individual marginal effect is irrelevant."]
    virtue: [A, med, "Conscientiousness and civic virtue."]
    divine_command: [A, low, "Stewardship of creation and obedience to just law."]
    care: [null, low, "Not a care-centred issue."]
    contractualism: [A, high, "Fair play: no free-riding on a scheme whose burdens others bear."]
- id: fid11
  topic: late_assignment_emergency
  prompt: "You teach a course with a strict no-late-work rule. A diligent student submits a day late because she stopped to help an injured stranger. Accepting her work would have negligible costs."
  choices:
    A: "Enforce the rule and refuse the work."
    B: "Accept the work as an exception."
  expected:
    deontology: [A, low, "Treating like cases alike (fairness); a Rossian might permit the exception."]
    act_utilitarian: [B, med, "Accepting yields benefits with negligible cost."]
    rule_utilitarian: [A, med, "Reliable deadlines have net benefits; exceptions erode the rule."]
    virtue: [B, med, "Equity (epieikeia) and compassion; practical wisdom overrides rigid rules."]
    divine_command: [B, med, "Mercy over strict justice."]
    care: [B, high, "Responsiveness to the particular student and her situation."]
    contractualism: [B, med, "A principle allowing emergency exceptions cannot be reasonably rejected."]
- id: fid12
  topic: overloaded_lifeboat
  prompt: "A lifeboat built for nine holds ten people and is sinking; unless one person goes overboard, all ten will drown. There is no basis to rank their worth."
  choices:
    A: "Draw lots to choose one person to throw overboard."
    B: "Throw no one overboard, accepting that all may die."
  expected:
    deontology: [B, med, "Killing an innocent is impermissible even to save others."]
    act_utilitarian: [A, high, "Nine lives outweigh one."]
    rule_utilitarian: [A, med, "A fair-lottery rule for such extremis cases maximises survival."]
    virtue: [null, low, "Tragic dilemma; no settled verdict."]
    divine_command: [B, med, "Intentional killing of an innocent is never licit (Thomist reading; contested)."]
    care: [null, low, "No canonical care-ethical verdict."]
    contractualism: [A, med, "A fair lottery is a principle each could accept ex ante."]
- id: fid13
  topic: motive_worth
  prompt: "Two people each regularly help a sick neighbour. Ana does so because she feels no inclination at all but believes it is her duty. Ben does so out of warm affection and finds it joyful. Which person's action shows greater moral worth?"
  choices:
    A: "Ana's, helping purely from duty."
    B: "Ben's, helping from warm affection."
  expected:
    deontology: [A, high, "Kant: an action has moral worth only when done from duty, not inclination."]
    act_utilitarian: [null, high, "Outcomes are identical; moral worth of motive is not what the theory measures."]
    rule_utilitarian: [null, high, "Outcomes are identical."]
    virtue: [B, high, "Aristotle: the virtuous person takes pleasure in acting well; Ana is merely continent."]
    divine_command: [null, low, "Both can be charity; traditions differ."]
    care: [B, med, "Natural caring (Noddings) is the root of moral action; duty-based caring is derivative."]
    contractualism: [null, med, "Motive is irrelevant to permissibility."]
- id: fid14
