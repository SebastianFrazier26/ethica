name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # mlx only ships wheels for Apple Silicon macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: dependency audit
        run: |
          uv export --locked --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/req.txt"
          uv run pip-audit -r "$RUNNER_TEMP/req.txt" --disable-pip --no-deps
